<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
    <script type="module" src="/src/index.js"></script>
    <link rel="icon" type="image/x-icon" href="imgs/battleship-icon.webp" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main>
      <section class="title-section">
        <h1>Battleship Online</h1>
      </section>
      <hr class="title-sep" />

      <section class="extra">
        <h1 class="game-guide">Player 1 places ships, player 2 leaves</h1>
      </section>

      <section class="sub-title">
        <section class="player-1-info"></section>
        <section class="both-gameboards">
          <section class="gameboard-sect-1">
            <h1 class="board-desc">Player 1</h1>
            <ul class="buttons-ul">
              <li class="buttons-li">
                <button class="game-button randomize-1">Randomize</button>
              </li>
              <li class="buttons-li">
                <button class="game-button reset-1" disabled>Reset</button>
              </li>
              <li class="buttons-li">
                <button class="game-button confirm-1" disabled>Confirm</button>
              </li>
            </ul>
            <div class="board-1"></div>
          </section>
          <section class="gameboard-sect-2">
            <h1 class="board-desc">Player 2</h1>
            <ul class="buttons-ul">
              <li class="buttons-li">
                <button class="game-button randomize-2" disabled>
                  Randomize
                </button>
              </li>
              <li class="buttons-li">
                <button class="game-button reset-2" disabled>Reset</button>
              </li>
              <li class="buttons-li">
                <button class="game-button confirm-2" disabled>Confirm</button>
              </li>
            </ul>
            <div class="board-2"></div>
          </section>
        </section>
        <section class="player-2-info"></section>
      </section>
    </main>
  </body>
</html>
